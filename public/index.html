<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Notefyer | Painel de Notificações</title>
    <script src="index.js" defer></script>
</head>
<body>
    <main class="container">
        <h1 style="display: none">NoteFyer app</h1>
        <section>
            <h2>Enviar Notificação</h2>

            <form id="notificationForm">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required />
                </div>
                <div class="form-group">
                    <label for="message">Mensagem:</label>
                    <textarea id="message" rows="4" maxlength="50" placeholder="Digite uma mensagem entre 6 e 50 caracteres" required></textarea>
                </div>
                <button type="submit" id="sendButton" class="success">Enviar via AJAX</button>
            </form>
        </section>

        <hr style="margin: 60px 0" />

        <section>
            <h2>Histórico</h2>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>E-mail</th>
                    <th>Mensagem</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="notificationsTable"></tbody>
            </table>
            <button type="button" id="clearButton" class="danger">Limpar histórico</button>
        </section>
    </main>
</body>
</html>
