<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Notefyer | Painel de Notificações</title>
</head>
<body>
<div class="container">
    <h2>Enviar Notificação</h2>
    <form id="notificationForm">
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required />
        </div>
        <div class="form-group">
            <label for="message">Mensagem:</label>
            <textarea id="message" rows="4" required></textarea>
        </div>
        <button type="submit">Enviar via AJAX</button>
    </form>

    <hr style="margin-top: 30px" />

    <h2>Histórico de Notificações</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>E-mail</th>
            <th>Mensagem</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody id="notificationsTable"></tbody>
    </table>
</div>
<script>
    const form = document.getElementById("notificationForm");
    const tableBody = document.getElementById("notificationsTable");
    const emailInput = document.getElementById("email");
    const messageInput = document.getElementById("message");

    loadNotifications();

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        try {
            const response = await fetch("api.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: emailInput.value,
                    message: messageInput.value
                }),
            });

            const result = await response.json();

            if (result.success) {
                form.reset();
                await loadNotifications();
            }
        } catch (error) {
            console.error("Error:", error);
        }
    });

    async function loadNotifications() {
        try {
            const response = await fetch("api.php");
            const notifications = await response.json();
            handleMountNotificationTable(notifications);
        } catch (error) {
            console.error("Error:", error);
        }
    }

    function handleMountNotificationTable(notifications) {
        tableBody.innerHTML = notifications?.map((notification) => {
            const { id, email, message, status } = notification;
            return `
               <tr>
                   <td>${id}</td>
                   <td>${email}</td>
                   <td>${message}</td>
                   <td class="status_${status}">${status}</td>
               </tr>
           `;
        }).join("");
    }
</script>
</body>
</html>
