
services:
  webserver:
    image: nginx:alpine
    container_name: notefyer_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: notefyer_php
    container_name: notefyer_php
    environment:
      - DB_HOST=db
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
  db:
    image: mariadb:10.5
    container_name: notefyer_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3307"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
  rabbitmq:
    image: rabbitmq:3-management
    container_name: notefyer_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: notefyer_php
    container_name: notefyer_worker
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    command: php worker.php
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
    restart: unless-stopped
  memcached:
    image: memcached:alpine
    container_name: notefyer_memcached
    ports:
      - "11211:11211"